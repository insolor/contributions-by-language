name: Update contributions chart

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
    concurrency:
      group: update-contributions-chart
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.7'

      - name: Generate the chart
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: uv run --locked contributions-by-language

      - name: Commit and push changes
        run: |
          output=$(uv run --locked python -c 'from contributions_by_language.settings import load_settings; print(load_settings([]).output)')
          git --literal-pathspecs add -- "$output"
          if [[ -d cache ]]; then
            git add -- cache/
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contributions chart'
          git push
