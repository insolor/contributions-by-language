name: Check contributions chart

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the changes
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.7'

      - name: Verify chart generation from the committed cache
        run: uv run --locked python scripts/check_chart.py
