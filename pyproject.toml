[project]
name = "contributions-by-language"
version = "0.1.0"
description = "Generate a yearly GitHub commit chart by repository language"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-Linguist"]
authors = [
    { name = "insolor", email = "2442833+insolor@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "filelock>=3,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-config[yaml]>=0.4.0",
    "pydantic-settings>=2.12,<3",
    "tqdm>=4.67,<5",
]

[project.scripts]
contributions-by-language = "contributions_by_language.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "scripts"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
    "types-tqdm>=4.70.0.20261106",
]
